    - data:
        title: 招商术语归一化
        desc: 专有名词大小写归一化、商业简称与医学技术术语扩展
        type: code
        code_language: python3
        code: "def main(query: str = \"\") -> dict:\n    import re\n    q = query.strip() if query else \"\"\n    synonym_map = {\n        \"fmt\": \"FMT 肠道菌群移植\",\n        \"asd\": \"ASD 孤独症自闭症\",\n        \"ibd\": \"IBD 炎症性肠病\",\n        \"sibo\": \"SIBO 小肠细菌过度生长\",\n        \"ibs\": \"IBS 肠易激综合征\",\n        \"cfu\": \"CFU 活菌数\",\n        \"活菌量\": \"活菌数量与活性指标\",\n        \"供体\": \"供体筛选与严苛质控标准\",\n        \"代理\": \"招商代理与合作政策\",\n        \"加盟\": \"招商加盟与合作模式\",\n        \"底价\": \"合作政策与价格体系\",\n        \"独家\": \"区域独家代理政策\",\n        \"资质\": \"企业资质与医疗器械认证\",\n    }\n    sorted_keys = sorted(synonym_map.keys(), key=len, reverse=True)\n    patterns = []\n    for k in sorted_keys:\n        if k.isascii():\n            patterns.append(rf\"(?<![a-zA-Z]){re.escape(k)}(?![a-zA-Z])\")\n        else:\n            patterns.append(re.escape(k))\n    combined_pattern = re.compile(\"|\".join(patterns), flags=re.IGNORECASE)\n    \n    def _repl(match):\n        matched_text = match.group(0).lower()\n        return synonym_map.get(matched_text, match.group(0))\n    \n    norm_q = combined_pattern.sub(_repl, q)\n    return {\"normalized_query\": norm_q, \"original_query\": q}"
        outputs:
          normalized_query:
            type: string
            children: null
          original_query:
            type: string
            children: null
