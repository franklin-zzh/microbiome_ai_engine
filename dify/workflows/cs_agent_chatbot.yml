    - data:
        code: "def main(query: str = \"\", qa_docs: list = None, doc_docs: list =\
          \ None) -> dict:\n    # 1. 保底防空处理：如果 upstream 节点传了 None，自动转为空列表 []\n   \
          \ qa_docs = qa_docs if isinstance(qa_docs, list) else []\n    doc_docs =\
          \ doc_docs if isinstance(doc_docs, list) else []\n\n    def pick_score(d:\
          \ dict) -> float:\n        # Dify 1.16 knowledge-retrieval 的分数在 metadata.score（部分版本在顶层\
          \ score），都兼容\n        try:\n            s = d.get(\"score\")\n         \
          \   if s is None:\n                s = (d.get(\"metadata\") or {}).get(\"\
          score\", 0.0)\n            return float(s)\n        except (ValueError,\
          \ TypeError):\n            return 0.0\n\n    merged = []\n\n    # 2. 遍历\
          \ QA 知识库\n    for d in qa_docs:\n        if isinstance(d, dict):  # 确保元素是字典，防止\
          \ .get 方法报错\n            # 兼容多种可能的文本字段名\n            content = d.get(\"\
          content\") or d.get(\"text\") or d.get(\"title\") or \"\"\n            title\
          \ = d.get(\"title\") or \"\"\n            merged.append({\n            \
          \    \"content\": content,\n                \"title\": title,\n        \
          \        \"score\": pick_score(d),\n                \"source\": \"CS_QA\"\
          ,\n            })\n\n    # 3. 遍历 DOC 知识库\n    for d in doc_docs:\n     \
          \   if isinstance(d, dict):\n            content = d.get(\"content\") or\
          \ d.get(\"text\") or d.get(\"title\") or \"\"\n            title = d.get(\"\
          title\") or \"\"\n            merged.append({\n                \"content\"\
          : content,\n                \"title\": title,\n                \"score\"\
          : pick_score(d),\n                \"source\": \"CS_DOC\",\n            })\n\
          \n    # 4. 按得分降序排序\n    merged.sort(key=lambda x: x[\"score\"], reverse=True)\n\
          \n    # 5. 返回 merged 给下游分支；top_score 供 if-else 置信度门槛使用\n    return {\"merged\"\
          : merged, \"top_score\": merged[0][\"score\"] if merged else 0.0}"
