    - data:
        title: 术语归一化
        desc: 专有名词大小写归一化与医学缩写扩展（如 fmt -> FMT 肠道菌群移植）
        type: code
        code_language: python3
        code: "def main(query: str = \"\") -> dict:\n    import re\n    q = query.strip()\
          \ if query else \"\"\n    synonym_map = {\n        \"fmt\": \"FMT 肠道菌群移植\"\
          ,\n        \"asd\": \"ASD 孤独症自闭症\",\n        \"ibd\": \"IBD 炎症性肠病\",\n \
          \       \"sibo\": \"SIBO 小肠细菌过度生长\",\n        \"ibs\": \"IBS 肠易激综合征\",\n\
          \        \"bmi\": \"BMI 体重指数\",\n        \"gut\": \"肠道菌群\",\n        \"\
          粪菌移植\": \"FMT 肠道菌群移植\",\n        \"菌群移植\": \"FMT 肠道菌群移植\",\n        \"肠菌检测\"\
          : \"肠道菌群检测\",\n    }\n    sorted_keys = sorted(synonym_map.keys(), key=len,\
          \ reverse=True)\n    patterns = []\n    for k in sorted_keys:\n        if\
          \ k.isascii():\n            patterns.append(rf\"(?<![a-zA-Z]){re.escape(k)}(?![a-zA-Z])\"\
          )\n        else:\n            patterns.append(re.escape(k))\n    combined_pattern\
          \ = re.compile(\"|\".join(patterns), flags=re.IGNORECASE)\n    \n    def\
          \ _repl(match):\n        matched_text = match.group(0).lower()\n       \
          \ return synonym_map.get(matched_text, match.group(0))\n    \n    norm_q\
          \ = combined_pattern.sub(_repl, q)\n    return {\"normalized_query\": norm_q,\
          \ \"original_query\": q}"
        outputs:
          normalized_query:
            type: string
            children: null
          original_query:
            type: string
            children: null
        selected: false
        variables:
