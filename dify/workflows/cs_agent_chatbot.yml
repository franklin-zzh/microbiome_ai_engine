            2. 【多轮指代消解与上下文补全】：若用户输入包含代词或语义省略（如前文在聊“菌群移植/FMT”，追问“适合什么年龄”、“小孩能做吗”、“有什么禁忌”），必须结合对话历史补齐主语与背景（如改写为：「富玛特肠道菌群移植(FMT)儿童自闭症或特定人群适应症与禁忌说明」）。
