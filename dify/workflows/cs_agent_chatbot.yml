# 客服 Agent 工作流 (CS Agent Chatbot) —— 双库检索 + Rerank
# 导入方式：Dify -> 创建应用 -> 导入 DSL（如需实际导入请根据 Dify 当前版本导出空模板后替换本文件字段）
#
# 知识库双库利用（2026-08-12 起）：
# - CS_QA（问答库，qa_model / Knowledge Pipeline 生成）：语义检索，精确回答客服 FAQ
# - CS_DOC（长文档库，text_model / create_by_file 原生切割）：hybrid 检索，覆盖公司文档/手册等长文
# 两路结果合并后经 Rerank 排序，由 answer_llm 统一作答；高分缺失才转人工。

app:
  name: 肠道健康客服助手
  mode: chatbot
  icon: 🤖

description: |
  挂载 CS_QA + CS_DOC 双知识库，回答肠菌检测/调养客服问题。
  QA 库语义检索 + DOC 库混合检索 -> Rerank 重排 -> LLM 作答；
  检索为空或命中高风险关键词时，触发转人工并回调后端捕获未解答问题。

environment_variables:
  - name: BACKEND_BASE_URL
    value: http://host.docker.internal:8000
    type: string
  # P0：回调共享密钥（导入后填入与 backend .env INTERNAL_API_KEY 相同的值）
  - name: INTERNAL_API_KEY
    value: ""
    type: string

workflow:
  # ========== 1. 开始节点 ==========
  - node_id: start
    type: start
    outputs:
      - name: query
        type: string
        description: 用户输入

  # ========== 2. 高风险关键词检查（前置护栏） ==========
  - node_id: risk_guard
    type: llm
    model: DeepSeek-V3
    system: |
      你是一台安全分类器。判断用户输入是否包含任何高风险医疗描述或症状。
      高风险清单：便血、黑便、鲜血便、剧烈腹痛、持续腹痛、绞痛、持续腹泻、水样便、脓血便、
      体重骤降、不明原因消瘦、肠梗阻、肠穿孔、肠癌、直肠癌、结肠癌、高烧不退、严重脱水。
      仅回答 true 或 false，不要解释。
    prompt: "用户输入：{{#start.query#}}"
    outputs:
      - name: risk_flag
        type: string

  # ========== 3. 条件分支：高风险直接转人工 ==========
  - node_id: risk_branch
    type: condition
    conditions:
      - if: "{{#risk_guard.risk_flag#}} == 'true'"
        to: risk_handoff
      - else:
        to: knowledge_retrieval_qa

  # ========== 3a. 高风险转人工话术 + 回调 ==========
  - node_id: risk_handoff
    type: template
    template: |
      您描述的情况可能涉及健康风险，我这边无法在线判断。建议您尽快联系专业医生或拨打客服热线。
      我马上为您转接专属健康顾问。

  - node_id: risk_callback
    type: http_request
    method: POST
    url: "{{#env.BACKEND_BASE_URL#}}/api/v1/cs/unanswered/capture"
    headers:
      Content-Type: application/json
      X-API-Key: "{{#env.INTERNAL_API_KEY#}}"
    body:
      user_query: "{{#start.query#}}"
      risk_flag: true
      context:
        channel: dify_cs_agent

  # ========== 4. 双库检索 ==========
  # 4a. QA 问答库：语义检索，精确问答（Pipeline 生成的高质量 QA 对）
  - node_id: knowledge_retrieval_qa
    type: knowledge_retrieval
    dataset: CS_QA
    retrieval_mode: semantic
    top_k: 3
    score_threshold: 0.65
    query: "{{#start.query#}}"
    outputs:
      - name: result
        type: array

  # 4b. DOC 长文档库：hybrid 检索（全文+语义），覆盖公司文档/产品手册等长文；
  #     阈值放宽，交给 Rerank 精排
  - node_id: knowledge_retrieval_doc
    type: knowledge_retrieval
    dataset: CS_DOC
    retrieval_mode: hybrid
    top_k: 5
    score_threshold: 0.3
    query: "{{#start.query#}}"
    outputs:
      - name: result
        type: array

  # ========== 4c. 合并两路结果（带来源标识，供 Rerank/回答引用） ==========
  - node_id: merge_docs
    type: code
    code_language: python3
    code: |
      def main(query: str, qa_docs: list, doc_docs: list) -> dict:
          merged = []
          for d in qa_docs:
              merged.append({"content": d.get("content") or d.get("title", ""),
                             "title": d.get("title", ""),
                             "score": d.get("score", 0.0),
                             "source": "CS_QA"})
          for d in doc_docs:
              merged.append({"content": d.get("content") or d.get("title", ""),
                             "title": d.get("title", ""),
                             "score": d.get("score", 0.0),
                             "source": "CS_DOC"})
          return {"merged": merged}
    inputs:
      - name: query
        value: "{{#start.query#}}"
        type: string
      - name: qa_docs
        value: "{{#knowledge_retrieval_qa.result#}}"
        type: array
      - name: doc_docs
        value: "{{#knowledge_retrieval_doc.result#}}"
        type: array
    outputs:
      - name: merged
        type: array

  # ========== 5. Rerank 精排 ==========
  # 前置条件：Dify「模型供应商」需配置 rerank 模型（如 bge-reranker-v2-m3 / bge-reranker-large）
  - node_id: rerank
    type: rerank
    model: bge-reranker-v2-m3
    query: "{{#start.query#}}"
    documents: "{{#merge_docs.merged#}}"
    top_n: 5
    score_threshold: 0.3
    outputs:
      - name: result
        type: array

  # ========== 6. 置信度分支（基于 Rerank 后结果） ==========
  - node_id: score_branch
    type: condition
    conditions:
      - if: "{{#rerank.result#}}.length > 0"
        to: answer_llm
      - else:
        to: fallback_handoff

  # ========== 7. 正常回答 LLM ==========
  - node_id: answer_llm
    type: llm
    model: DeepSeek-V3
    system: |
      {{#system_prompt#}}
    prompt: |
      用户问题：{{#start.query#}}

      检索到的参考内容（Rerank 后按相关度排序）：
      {{#rerank.result#}}

      请基于参考内容生成回答，不要添加未在知识库中出现的信息。
      QA 知识库（CS_QA）中的问答对优先作为标准话术；DOC 知识库（CS_DOC）内容用于补充细节。
      如果参考内容无法回答，请输出“我无法确定”并建议转人工。

  # ========== 8. 低置信度兜底：回调 + 话术 ==========
  - node_id: fallback_handoff
    type: template
    template: |
      抱歉，您的问题比较复杂，我暂时无法准确回答。已为您记录，专属健康顾问会尽快联系您，请稍候。

  - node_id: fallback_callback
    type: http_request
    method: POST
    url: "{{#env.BACKEND_BASE_URL#}}/api/v1/cs/unanswered/capture"
    headers:
      Content-Type: application/json
      X-API-Key: "{{#env.INTERNAL_API_KEY#}}"
    body:
      user_query: "{{#start.query#}}"
      match_score: 0.0
      risk_flag: false
      context:
        channel: dify_cs_agent
        score: "low"

  # ========== 9. 结束节点 ==========
  - node_id: end
    type: end
    answer: |
      {% if branch == 'risk' %}
      {{#risk_handoff.output#}}
      {% elif branch == 'answer' %}
      {{#answer_llm.output#}}
      {% else %}
      {{#fallback_handoff.output#}}
      {% endif %}

system_prompt: |
  你是「肠道健康」品牌的智能客服助手，只能回答：
  1) 肠菌检测流程与报告解读（非诊断）；
  2) 肠道健康科普知识；
  3) 公司产品和调养服务说明；
  4) 订单、物流、退款政策。

  严格遵循以下规则：
  - 不做出任何疾病诊断，不推荐使用药品或具体剂量。
  - 遇到便血、剧烈腹痛、持续腹泻、体重骤降、高烧等高风险描述时，必须立刻输出转人工话术，不再继续回答问题。
  - 报告中的检测指标仅做“科普性解释”，结尾必须建议用户咨询医生或营养师。
  - 产品功效只引用已审核知识库内的标准话术，不得自行发挥。
  - 若用户问题超出知识库范围或你不确定，请礼貌告知无法回答并引导转人工。
  - 所有医疗相关内容末尾追加：以上信息仅供参考，不能替代专业医疗建议。如有不适，请及时就医。

recommended_model:
  provider: DeepSeek
  model: DeepSeek-V3
  temperature: 0.3
  max_tokens: 1024
