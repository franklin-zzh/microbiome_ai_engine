app:
  description: '挂载 CS_QA + CS_DOC 双知识库，回答肠菌检测/调养客服问题。

    后端已做高风险关键词拦截（第一道），本工作流 risk_guard 语义兑底（第二道）；

    QA 库语义检索 + DOC 库混合检索（各自内置 Rerank）-> 合并按分排序 -> LLM 作答；

    语义兑底命中或检索为空时触发转人工，并回调后端捕获未解答问题。

    '
  icon: 🤖
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: 肠道健康客服助手
  use_icon_as_answer_icon: false
