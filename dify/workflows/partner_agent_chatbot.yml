    - data:
        title: 商务与战略术语归一化
        desc: 专有名词、公司品牌、战略合作与商业术语扩展
        type: code
        code_language: python3
        code: "def main(query: str = \"\") -> dict:\n    import re\n    q = query.strip()\
          \ if query else \"\"\n    \n    # 识别纯问候/打招呼（毫秒级短路，不走大模型检索）\n    greeting_pattern\
          \ = re.compile(\n        r\"^(你好|您好|在吗|在么|哈喽|hello|hi|早|早上好|下午好|晚上好|打扰一下|有人吗)[\\\
          s!！?？~～.]*$\", \n        re.IGNORECASE\n    )\n    is_greeting = bool(greeting_pattern.match(q))\n\
          \n    synonym_map = {\n        \"fmt\": \"FMT 肠道菌群移植\",\n        \"富玛特\"\
          : \"富玛特生物科技（FMT）\",\n        \"公司介绍\": \"富玛特公司背景、核心团队与发展历程\",\n        \"\
          公众号\": \"富玛特官方微信公众号与新媒体矩阵\",\n        \"赞助\": \"战略合作、峰会赞助与品牌联名\",\n    \
          \    \"投资\": \"融资历程、商业模式与战略投资机会\",\n        \"代理\": \"区域独家代理、合伙人招商政策\",\n\
          \        \"合同\": \"商务合作协议与合同模板标准框架\",\n        \"底价\": \"合作政策与阶梯采购价格机制\"\
          ,\n        \"活菌量\": \"单袋/单粒活菌量 CFU 与活性锁鲜技术\",\n        \"供体\": \"严格供体筛选标准（高于行业平均标准）\"\
          ,\n        \"资质\": \"医疗器械认证、三甲临床合作背书\",\n    }\n    sorted_keys = sorted(synonym_map.keys(),\
          \ key=len, reverse=True)\n    patterns = []\n    for k in sorted_keys:\n\
          \        if k.isascii():\n            patterns.append(rf\"(?<![a-zA-Z]){re.escape(k)}(?![a-zA-Z])\"\
          )\n        else:\n            patterns.append(re.escape(k))\n    combined_pattern\
          \ = re.compile(\"|\".join(patterns), flags=re.IGNORECASE)\n    \n    def\
          \ _repl(match):\n        matched_text = match.group(0).lower()\n       \
          \ return synonym_map.get(matched_text, match.group(0))\n    \n    norm_q\
          \ = combined_pattern.sub(_repl, q)\n    return {\n        \"normalized_query\"\
          : norm_q, \n        \"original_query\": q,\n        \"is_greeting\": \"\
          true\" if is_greeting else \"false\"\n    }"
        outputs:
          normalized_query:
            type: string
            children: null
          original_query:
            type: string
            children: null
          is_greeting:
            children: null
            type: string
        selected: false
