        code: |-
          def main(query: str = "", qa_docs: list = None, doc_docs: list = None) -> dict:
              qa_docs = qa_docs if isinstance(qa_docs, list) else []
              doc_docs = doc_docs if isinstance(doc_docs, list) else []

              def pick_score(d: dict) -> float:
                  try:
                      s = d.get("score")
                      if s is None:
                          s = (d.get("metadata") or {}).get("score", 0.0)
                      return float(s)
                  except (ValueError, TypeError):
                      return 0.0

              merged = []
              for d in qa_docs:
                  if isinstance(d, dict):
                      content = d.get("content") or d.get("text") or d.get("title") or ""
                      title = d.get("title") or ""
                      merged.append({"content": content, "title": title, "score": pick_score(d), "source": "PARTNER_QA"})

              for d in doc_docs:
                  if isinstance(d, dict):
                      content = d.get("content") or d.get("text") or d.get("title") or ""
                      title = d.get("title") or ""
                      merged.append({"content": content, "title": title, "score": pick_score(d), "source": "COMPANY_DOC"})

              merged.sort(key=lambda x: x["score"], reverse=True)
              return {"merged": merged, "top_score": merged[0]["score"] if merged else 0.0}
        code_language: python3
        desc: 合并商务问答与公司技术文档两路检索结果
