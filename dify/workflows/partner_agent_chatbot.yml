    - data:
        title: 检索词清洗
        desc: 剥除思考标签并提取最终检索 Query
        type: code
        code_language: python3
        code: |-
          def main(llm_text: str = "", fallback_query: str = "") -> dict:
              import re
              text = re.sub(r"<think>.*?</think>", "", llm_text or "", flags=re.S).strip()
              clean_query = text if text else (fallback_query or "")
              clean_query = clean_query.strip('"\'“”‘’').strip()
              return {"search_query": clean_query if clean_query else (fallback_query or "")}
        outputs:
