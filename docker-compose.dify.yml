# ============================================================
# Dify 私有化部署（本地开发集）· 官方镜像 1.16.1
# 用法：docker compose -f docker-compose.dify.yml --env-file .env.dify up -d
# 控制台：http://<服务器IP>:3080    API：http://<服务器IP>:5081
# 注意：
#   - 生产环境请使用 Dify 官方仓库完整 compose（含 nginx/ssrf_proxy/certbot）
#   - 对外仅暴露 web(3080) 与 api(5081) 两个端口，其余服务只走容器内网
#   - 数据卷统一挂载到 ${DIFY_DATA_ROOT}（默认 ./docker/volumes）
#   - SECRET_KEY 请改为 `openssl rand -base64 42` 生成的值
#   - Redis 由本 compose 自带的 redis 服务提供（Dify 独占 db4）
#   - 各服务已设内存上限（deploy.resources.limits.memory，可按需调整）
# ============================================================

services:
  init_permissions:
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/app/storage:/app/api/storage
    restart: "no"

  # 初始化 db 数据目录属主（postgres 用户），避免宿主 root 创建的目录导致 postgres 无法写入
  init_db:
    image: postgres:15-alpine
    command: ["chown", "-R", "postgres:postgres", "/var/lib/postgresql/data"]
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/db/data:/var/lib/postgresql/data
    restart: "no"

  # The PostgreSQL database (Dify 元数据库，仅容器内网)
  db_postgres:
    image: postgres:15-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      init_db:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db_postgres", "-U", "${DB_USERNAME:-postgres}", "-d", "${DB_DATABASE:-dify}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Redis（Dify 独占 db4，仅容器内网）
  redis:
    image: redis:7-alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456} --appendonly yes
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-difyai123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The Weaviate vector store (Dify 内置向量库)
  weaviate:
    image: semitechnologies/weaviate:1.19.0
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/weaviate:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_KEY_USERS:-hello@dify.ai}
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_API_KEY_USERS:-hello@dify.ai}

  # The DifySandbox
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      # 本地开发默认关闭 sandbox 联网（避免 SSRF 风险；客服场景不需要代码节点联网）
      ENABLE_NETWORK: "false"
      SANDBOX_PORT: 8194
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/sandbox/dependencies:/dependencies
      - ${DIFY_DATA_ROOT:-./docker/volumes}/sandbox/conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]

  # plugin daemon (Dify 1.16 插件运行时)
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.3-local
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_HOST: db_postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_SSL_MODE: disable
      SERVER_PORT: 5002
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
      PPROF_ENABLED: "false"
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: "false"
      PYTHON_ENV_INIT_TIMEOUT: 120
      PLUGIN_MAX_EXECUTION_TIMEOUT: 600
      PLUGIN_STDIO_BUFFER_SIZE: 1024
      PLUGIN_STDIO_MAX_BUFFER_SIZE: 5242880
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/plugin_daemon:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy

  # Dify Agent backend service
  agent_backend:
    image: langgenius/dify-agent-backend:1.16.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      DIFY_AGENT_REDIS_URL: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/4
      DIFY_AGENT_REDIS_PREFIX: dify-agent
      DIFY_AGENT_PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      DIFY_AGENT_INNER_API_URL: http://api:5001
      DIFY_AGENT_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_SERVER_SECRET_KEY: ${DIFY_AGENT_SERVER_SECRET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY}
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}
      DIFY_AGENT_SHUTDOWN_GRACE_SECONDS: 30
      DIFY_AGENT_RUN_RETENTION_SECONDS: 259200
    depends_on:
      plugin_daemon:
        condition: service_started
      redis:
        condition: service_healthy

  # Local sandbox for Dify Agent shell workspaces
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.16.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      - SHELLCTL_AUTH_TOKEN=${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}
      - NO_PROXY=localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # API service
  api:
    image: langgenius/dify-api:1.16.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      MODE: api
      SECRET_KEY: ${SECRET_KEY:-please-change-me-using-openssl-rand-base64-42}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: db_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dify}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/4
      CELERY_BACKEND: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/4
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      PLUGIN_DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      AGENT_BACKEND_BASE_URL: http://agent_backend:5050
      AGENT_BACKEND_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent_backend:
        condition: service_started
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/app/storage:/app/api/storage
    ports:
      - "${API_PORT:-5081}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # worker service (Celery worker)
  worker:
    image: langgenius/dify-api:1.16.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      MODE: worker
      SECRET_KEY: ${SECRET_KEY:-please-change-me-using-openssl-rand-base64-42}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: db_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-dify}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/4
      CELERY_BACKEND: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/4
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      PLUGIN_DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_AGENT_RUNTIME_BACKEND: local
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: http://local_sandbox:5004
      DIFY_AGENT_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      AGENT_BACKEND_BASE_URL: http://agent_backend:5050
      AGENT_BACKEND_API_TOKEN: ${DIFY_AGENT_API_TOKEN:-dify-agent-run-token-for-dev-only}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent_backend:
        condition: service_started
    volumes:
      - ${DIFY_DATA_ROOT:-./docker/volumes}/app/storage:/app/api/storage

  # Frontend web application
  web:
    image: langgenius/dify-web:1.16.1
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      APP_API_URL: ${APP_API_URL:-}
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-ws://localhost}
      TEXT_GENERATION_TIMEOUT_MS: 60000
      WORKFLOW_GENERATION_TIMEOUT_MS: 180000
    ports:
      - "${WEB_PORT:-3080}:3000"
    depends_on:
      - api

# 内部网络：显式固定网络名 fmt-dify-network，供 Dify 各服务容器内网互访；
# attachable 允许未来其他 compose/容器(如 backend)加入该网络直连互访
networks:
  default:
    name: fmt-dify-network
    attachable: true
