# ==============================================================================
# 阿里云大 Nginx 转发配置段 (wx.fmtcloud.cn)
# 
# 放置路径建议：/etc/nginx/conf.d/wx.fmtcloud.cn.conf
# 作用：
# 1. 域名 wx.fmtcloud.cn 统一监听 80/443
# 2. 将微信回调、API、审核管理后台、探活端点反向代理至后端的 13009 端口
# ==============================================================================

# HTTP 强制 301 重定向至 HTTPS
server {
    listen 80;
    server_name wx.fmtcloud.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 核心服务
server {
    listen 443 ssl http2;
    server_name wx.fmtcloud.cn;

    # SSL 证书配置（根据您服务器上的实际证书路径调整）
    ssl_certificate     /etc/nginx/ssl/wx.fmtcloud.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/wx.fmtcloud.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 日志记录
    access_log /var/log/nginx/wx.fmtcloud.cn_access.log;
    error_log  /var/log/nginx/wx.fmtcloud.cn_error.log;

    # 允许上传的知识库文档上限 (50MB)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # 1. 微信客服 / 企微自建应用 Webhook 回调端点 (兼容 /wx/... 与 /api/v1/wx/...)
    # 微信要求 5 秒内响应，配置紧凑的连接超时
    # --------------------------------------------------------------------------
    location ~ ^/(wx/|api/v1/wx/|api/v1/sales/wecom/) {
        proxy_pass http://127.0.0.1:13006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # --------------------------------------------------------------------------
    # 2. 审核后台单页与静态资源 (/admin)
    # --------------------------------------------------------------------------
    location /admin {
        proxy_pass http://127.0.0.1:13006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. 业务 API 接口 (/api/v1/...)
    # 涉及大模型检索与推理，放宽读超时至 120s
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:13006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 4. 健康探活端点 (/health)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://127.0.0.1:13006/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
