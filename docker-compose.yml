# ============================================================
# agent_cs 网关栈：FastAPI backend
# 数据库/缓存复用本地 Docker 部署的既有容器（不在本 compose 重复创建）：
#   - MySQL 8   global-mysql8  @3306  (root/fumate)
#   - Redis     redis          @6380  (密码 fumate，本项目独占 db3)
# Dify 私有化部署见 docker-compose.dify.yml（官方镜像 1.16.1）
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # 容器内访问宿主机 MySQL/Redis 使用 host.docker.internal
      # 单库 mb_ai_engine：表结构由 Alembic 管理，启动时自动 upgrade head
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_PASSWORD:-fumate}@host.docker.internal:3306/mb_ai_engine?charset=utf8mb4
      - REDIS_URL=redis://:${REDIS_PASSWORD:-fumate}@host.docker.internal:6380/3
      - DIFY_BASE_URL=${DIFY_BASE_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - CS_DATASET_ID=${CS_DATASET_ID}
      - SALES_DATASET_ID=${SALES_DATASET_ID}
      - APP_NAME=agent_cs
      - DEBUG=${DEBUG:-true}
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    extra_hosts:
      - "host.docker.internal:host-gateway"
