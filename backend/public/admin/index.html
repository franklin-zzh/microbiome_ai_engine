<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库审核后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6f8; color: #222; }
  header { background: #1f2d3d; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; flex: 1; }
  #logout { background: none; border: 1px solid #ffffff66; color: #fff; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  main { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px #0000001a; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; font-family: inherit; }
  button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #3370ff; color: #fff; }
  .btn-success { background: #00b42a; color: #fff; }
  .btn-danger { background: #f53f3f; color: #fff; }
  .btn-warn { background: #ff7d00; color: #fff; }
  .btn-ghost { background: #f2f3f5; color: #333; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  th { background: #fafbfc; color: #666; font-weight: 600; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f0f5ff; }
  .tag { display: inline-block; background: #e8f3ff; color: #3370ff; border-radius: 3px; padding: 1px 6px; margin: 0 4px 2px 0; font-size: 12px; }
  .badge { display: inline-block; border-radius: 3px; padding: 1px 8px; font-size: 12px; }
  .b-PENDING { background: #fff7e6; color: #d48806; }
  .b-APPROVED { background: #e8f8ec; color: #00b42a; }
  .b-REJECTED { background: #ffece8; color: #f53f3f; }
  .b-REVOKED { background: #f2f3f5; color: #666; }
  .b-PUBLISHED { background: #e8f8ec; color: #00b42a; }
  .b-SUPERSEDED { background: #f2f3f5; color: #666; }
  .b-DRAFT { background: #f2f3f5; color: #666; }
  .detail { white-space: pre-wrap; background: #fafbfc; border-radius: 6px; padding: 12px; margin-top: 8px; font-size: 14px; line-height: 1.7; }
  .meta { color: #888; font-size: 12px; margin-top: 8px; }
  .actions { margin-top: 12px; display: flex; gap: 8px; }
  #loginBox { max-width: 360px; margin: 80px auto; }
  #loginBox .card { padding: 24px; }
  #loginBox .row { flex-direction: column; align-items: stretch; }
  .msg { color: #f53f3f; font-size: 13px; min-height: 18px; }
  .filters { margin-bottom: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>📚 知识库审核后台</h1>
  <span id="userName"></span>
  <button id="logout" class="hidden">退出</button>
</header>

<div id="loginBox" class="hidden">
  <div class="card">
    <h2 style="margin-bottom:12px">登录</h2>
    <div class="row">
      <input id="username" placeholder="用户名" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn-primary" onclick="login()">登录</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
</div>

<main id="mainBox" class="hidden">
  <div class="card" id="csDocumentCard">
    <h3 style="margin-bottom:10px">📄 CS 原始文档上传</h3>
    <p class="meta" style="margin-bottom:10px">上传原始文件；审核通过后按「知识库形态」发布：<b>QA 生成</b> → 问答库（Dify FILE → QA Processor → KB Pipeline）；<b>文本切割</b> → 长文档库（create_by_file 原生切块）。版本号按每份文档独立递增。</p>
    <div class="row" style="margin-bottom:8px">
      <input id="csDocTitle" placeholder="逻辑文档标题，例如：检测报告 FAQ" style="flex:2; min-width:220px">
      <input id="csDocCategory" placeholder="分类（默认 GENERAL）" style="flex:1; min-width:180px">
      <input id="csDocTags" placeholder="标签（逗号分隔）" style="flex:1; min-width:160px">
    </div>
    <div class="row">
      <select id="csDocForm">
        <option value="qa_model">QA 生成（问答库 / Pipeline）</option>
        <option value="text_model">文本切割（长文档库 / 原生切块）</option>
      </select>
      <input type="file" id="csDocFile" accept=".pdf,.doc,.docx,.txt,.md">
      <button class="btn-primary" onclick="createCsDocument()">上传并创建 V1.0 待审版</button>
      <span id="csDocMsg" class="meta"></span>
    </div>
  </div>

  <div class="card">
    <div class="row filters">
      <h3 style="flex:1">📚 CS 文档版本</h3>
      <select id="fCsDocStatus" onchange="loadCsDocuments()">
        <option value="">全部版本</option><option value="PENDING">待审核</option><option value="APPROVED">审核通过/发布中</option>
        <option value="PUBLISHED">已发布</option><option value="SUPERSEDED">已替代</option><option value="REJECTED">已驳回</option><option value="REVOKED">已下线</option>
      </select>
      <button class="btn-ghost" onclick="loadCsDocuments()">刷新</button>
    </div>
    <table><thead><tr><th>文档 ID</th><th>标题</th><th>形态</th><th>当前线上版本</th><th>版本数</th><th>分类</th></tr></thead>
      <tbody id="csDocumentList"><tr><td colspan="6" class="meta">加载中…</td></tr></tbody></table>
  </div>

  <div class="card hidden" id="csDocumentDetail">
    <div class="row" style="margin-bottom:8px"><h3 style="flex:1">🔎 CS 文档 #<span id="csDId"></span></h3></div>
    <div class="meta" id="csDMeta"></div><div id="csDVersions" style="margin-top:10px"></div>
  </div>

</main>

<script>
const API = "/api/v1";
let token = localStorage.getItem("kb_token") || "";

function hdr(json = false) {
  const h = {};
  if (token) h["Authorization"] = "Bearer " + token;
  if (json) h["Content-Type"] = "application/json";
  return h;
}
async function api(path, method = "GET", body = null) {
  const opt = { method, headers: hdr(body && !(body instanceof FormData)) };
  if (body && !(body instanceof FormData)) opt.body = JSON.stringify(body);
  if (body instanceof FormData) opt.body = body;
  const r = await fetch(API + path, opt);
  if (r.status === 401 && token) { token = ""; localStorage.removeItem("kb_token"); showLogin(); throw new Error("登录已过期"); }
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); msg = j.detail || j.message || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function showLogin() { document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("mainBox").classList.add("hidden"); }
function showMain() { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("mainBox").classList.remove("hidden"); }

async function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  document.getElementById("loginMsg").textContent = "";
  try {
    const j = await api("/auth/login", "POST", { username: u, password: p });
    token = j.access_token; localStorage.setItem("kb_token", token);
    document.getElementById("userName").textContent = j.role === "admin" ? "管理员" : j.role;
    document.getElementById("logout").classList.remove("hidden");
    showMain(); loadCsDocuments();
  } catch (e) { document.getElementById("loginMsg").textContent = "登录失败：" + e.message; }
}
document.getElementById("logout").onclick = () => { token = ""; localStorage.removeItem("kb_token"); document.getElementById("userName").textContent = ""; document.getElementById("logout").classList.add("hidden"); showLogin(); };

async function createCsDocument() {
  const title = document.getElementById("csDocTitle").value.trim();
  const file = document.getElementById("csDocFile").files[0];
  const msg = document.getElementById("csDocMsg");
  if (!title || !file) { msg.textContent = "请填写标题并选择原始文件"; return; }
  msg.textContent = "正在上传原始文件…";
  try {
    const form = new FormData(); form.append("file", file);
    const asset = await api("/knowledge/documents/assets", "POST", form);
    const doc = await api("/knowledge/documents", "POST", {
      title, asset_id: asset.id,
      category: document.getElementById("csDocCategory").value.trim() || "GENERAL",
      doc_form: document.getElementById("csDocForm").value,
      tags: document.getElementById("csDocTags").value.split(/[,，]/).map(x => x.trim()).filter(Boolean),
      created_by: "admin",
    });
    msg.textContent = `已创建文档 #${doc.id}，V1.0 待审核`;
    document.getElementById("csDocTitle").value = ""; document.getElementById("csDocCategory").value = "";
    document.getElementById("csDocTags").value = ""; document.getElementById("csDocFile").value = "";
    loadCsDocuments(); openCsDocument(doc.id);
  } catch (e) { msg.textContent = "创建失败：" + e.message; }
}

async function loadCsDocuments() {
  const status = document.getElementById("fCsDocStatus").value;
  const q = new URLSearchParams({ limit: "50" }); if (status) q.set("version_status", status);
  try {
    const data = await api("/admin/knowledge/documents?" + q.toString());
    const body = document.getElementById("csDocumentList");
    if (!data.items.length) { body.innerHTML = '<tr><td colspan="6" class="meta">暂无文档</td></tr>'; return; }
    body.innerHTML = data.items.map(doc => {
      const current = doc.versions.find(v => v.id === doc.current_version_id);
      const formLabel = { qa_model: "QA", text_model: "文本", hierarchical_model: "层级" }[doc.doc_form] || doc.doc_form;
      return `<tr class="clickable" onclick="openCsDocument(${doc.id})"><td>${doc.id}</td><td>${esc(doc.title)}</td><td><span class="tag">${formLabel}</span></td><td>${current ? 'V1.' + (current.revision - 1) + ' / ' + esc(current.status) : '-'}</td><td>${doc.versions.length}</td><td>${esc(doc.category)}</td></tr>`;
    }).join("");
  } catch (e) { document.getElementById("csDocumentList").innerHTML = '<tr><td colspan="6" class="meta">加载失败：' + esc(e.message) + '</td></tr>'; }
}

async function openCsDocument(id) {
  try {
    const doc = await api(`/admin/knowledge/documents/${id}`);
    document.getElementById("csDocumentDetail").classList.remove("hidden");
    document.getElementById("csDId").textContent = doc.id;
    document.getElementById("csDMeta").textContent = `当前线上版本：${doc.current_version_id || '无'} ｜ 形态：${doc.doc_form} ｜ 分类：${doc.category} ｜ 标签：${(doc.tags || []).join('、') || '-'}`;
    document.getElementById("csDVersions").innerHTML = doc.versions.map(v => {
      const target = (v.publish_targets || [])[0];
      const state = target ? `${target.status}${target.last_error ? '：' + target.last_error : ''}` : "未发布";
      const buttons = v.status === "PENDING" || v.status === "DRAFT"
        ? `<button class="btn-success" onclick="reviewCsVersion(${v.id},'approve')">通过并发布</button><button class="btn-danger" onclick="reviewCsVersion(${v.id},'reject')">驳回</button>`
        : v.status === "APPROVED" ? `<button class="btn-primary" onclick="retryCsVersion(${v.id})">重试发布</button><button class="btn-danger" onclick="reviewCsVersion(${v.id},'reject')">驳回</button>`
        : v.status === "PUBLISHED" ? `<button class="btn-warn" onclick="reviewCsVersion(${v.id},'revoke')">下线</button>` : "";
      return `<div class="detail"><b>V1.${v.revision - 1}</b>　<span class="badge b-${v.status}">${v.status}</span><br>原文件：<a href="javascript:downloadAsset(${v.asset_id})">下载</a> ｜ 内容 SHA256：${esc(v.content_sha256.slice(0, 12))}…<br>Pipeline：${esc(v.pipeline_version)} ｜ 发布状态：${esc(state)}<br>块快照：${(target && target.blocks ? target.blocks.length : 0)} 条 ${buttons}</div>`;
    }).join("");
    document.getElementById("csDocumentDetail").scrollIntoView({ behavior: "smooth" });
  } catch (e) { alert("加载 CS 文档失败：" + e.message); }
}

async function reviewCsVersion(id, action) {
  const label = { approve: "通过并发布", reject: "驳回", revoke: "下线" }[action];
  if (!confirm("确认" + label + "此版本？")) return;
  const note = prompt("审核备注（可选）") || null;
  try { await api(`/admin/knowledge/document-versions/${id}/${action}`, "POST", { operator: "admin", review_note: note }); loadCsDocuments(); }
  catch (e) { alert("操作失败：" + e.message); }
}

async function retryCsVersion(id) {
  try { await api(`/admin/knowledge/document-versions/${id}/retry-publish`, "POST"); alert("已安排重试，请刷新查看发布状态"); loadCsDocuments(); }
  catch (e) { alert("重试失败：" + e.message); }
}

async function downloadAsset(id) {
  const r = await fetch(`${API}/admin/knowledge/assets/${id}/source`, { headers: hdr() });
  if (!r.ok) { alert("下载失败：" + r.status); return; }
  const blob = await r.blob(); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "source_" + id; a.click(); URL.revokeObjectURL(a.href);
}

document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("username").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

if (token) { showMain(); loadCsDocuments(); } else { showLogin(); }
</script>
</body>
</html>
